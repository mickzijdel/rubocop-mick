# Actions are pinned to a commit SHA with the release tag in a trailing comment (supply-chain
# safety — see the github-actions skill). Bump with `pinact run -u`, verify with
# scripts/check_action_refs.sh. Adapted from the dev-env Ruby template for a gem: rspec instead of
# bin/rails test; the Rails-only scan job (brakeman/importmap/database_consistency) is dropped.
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Default GITHUB_TOKEN to read-only; a job needing more declares its own permissions: block.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Lint code for consistent style (rubocop + rubocop-mick's own cops)
        run: bundle exec rubocop -f github
      - name: Executable bits on shipped scripts
        # Any tracked file whose first line is a shebang must be mode 100755 in the index —
        # with core.fileMode=false a local chmod never reaches git, and a 100644 script dies with
        # exit 126 on a fresh clone. Mirrors the hk `exec-bit-scripts` step so CI and pre-commit agree.
        run: |
          bad=$(git ls-files -s | awk -F'\t' '$1 ~ /^100644/ { if ((getline line < $2) > 0 && line ~ /^#!/) print $2; close($2) }')
          if [ -n "$bad" ]; then
            echo "Shebang scripts missing the executable bit in the git index. Fix: git update-index --chmod=+x <file>"
            echo "$bad"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Run specs
        run: bundle exec rspec

  # A toolchain or service version is pinned in several files at once (mise.toml, the
  # .<lang>-version files, the Dockerfile ARGs, and the compose/deploy `image:` tags) because
  # different consumers read different ones, and nothing makes them agree — a bump that misses
  # one file is silent. Mirrors the hk `versions` step so the gates can't drift. Reads files
  # only, so it needs no toolchain: the cheapest job in this workflow.
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain and service versions agree across files
        run: bash scripts/check_version_sync.sh

  # MIT-licensed gitleaks CLI via mise (not gitleaks/gitleaks-action, which needs a paid license
  # on org repos) — the same scan the local hk pre-commit hook runs.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks git scans the full commit history
          persist-credentials: false
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      - name: Scan git history for secrets
        run: mise exec -- gitleaks git --redact --no-banner .

  # GitHub Actions workflow checks — mirror the hk actionlint + zizmor steps.
  actions-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      - name: Lint workflows (actionlint)
        run: actionlint -shellcheck=
      - name: Scan workflows with zizmor
        run: zizmor --no-progress .github/workflows/

  # Noisier audits — mirror the hk `check` hook.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Dead code (debride)
        run: bundle exec debride --whitelist .debride_whitelist lib
      - name: Duplication (flay — Ruby structural, advisory)
        run: bundle exec flay lib || true
      - name: Duplication (jscpd — token-based gate)
        # Runner + version policy shared with the hk gate via scripts/run-jscpd.sh; --require keeps
        # CI strict (an unrunnable jscpd fails the job).
        run: bash scripts/run-jscpd.sh --require ruby
      - name: Large files
        run: |
          limit=512000
          large=$(git ls-files | while read -r f; do
            s=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$s" -gt "$limit" ]; then echo "$f ($s bytes)"; fi
          done)
          if [ -n "$large" ]; then echo "Files exceed ${limit} bytes:"; echo "$large"; exit 1; fi
